- name: zen.little-arc.enabled
  value: true

- name: zen.little-arc.external-links
  value: true

- name: zen.little-arc.activation-method
  value: "alt+shift" # any combination of ctrl, alt, shift, meta joined by '+'; empty disables

- name: zen.little-arc.close-on-blur
  value: true

- name: zen.little-arc.width
  value: 960

- name: zen.little-arc.height
  value: 720

- name: zen.little-arc.close-delay
  value: 800 # in milliseconds; regaining focus within it cancels the close
